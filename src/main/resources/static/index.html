<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>Employee Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <p class="eyebrow">PEOPLE OPERATIONS</p>
            <h1>Employee management</h1>
            <p class="intro">Keep employee details up to date in one place.</p>
            <div class="session-bar">
                <p id="currentUser" class="status"></p>
                <button type="button" id="signOut" class="button-secondary">Sign out</button>
            </div>
        </header>

        <section class="panel admin-only" aria-labelledby="formHeading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">EMPLOYEE DETAILS</p>
                    <h2 id="formHeading">Add an employee</h2>
                </div>
            </div>

            <form id="employeeForm">
                <div class="form-grid">
                    <label for="firstName">First name
                        <input type="text" id="firstName" name="firstName"
                               autocomplete="given-name" maxlength="255" required>
                    </label>
                    <label for="lastName">Last name
                        <input type="text" id="lastName" name="lastName"
                               autocomplete="family-name" maxlength="255" required>
                    </label>
                    <label for="email">Email address
                        <input type="email" id="email" name="email"
                               autocomplete="email" maxlength="255" required>
                    </label>
                    <label for="departmentId">Department
                        <select id="departmentId" name="departmentId" required>
                            <option value="">Choose a department</option>
                        </select>
                    </label>
                </div>
                <div class="form-actions">
                    <button id="submitEmployee" type="submit">Save employee</button>
                    <button id="cancelEdit" class="button-secondary" type="button" hidden>
                        Cancel edit
                    </button>
                    <p id="message" class="status" role="status" aria-live="polite"></p>
                </div>
            </form>
        </section>

        <section class="panel" aria-labelledby="listHeading">
            <div class="section-heading list-heading">
                <div>
                    <p class="eyebrow">DIRECTORY</p>
                    <h2 id="listHeading">Employees</h2>
                </div>
                <button type="button" id="loadEmployees" class="button-secondary">
                    Refresh list
                </button>
            </div>

            <form id="departmentFilterForm" class="filter-bar" role="search">
                <label for="departmentFilter">Filter by department
                    <select id="departmentFilter" name="departmentId">
                        <option value="">All departments</option>
                    </select>
                </label>
                <button type="button" id="clearDepartmentFilter" class="button-secondary">
                    Show all
                </button>
            </form>

            <p id="listMessage" class="status" role="status" aria-live="polite">
                Loading employees…
            </p>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col"><button type="button" class="sort-button" data-sort="id">ID</button></th>
                            <th scope="col"><button type="button" class="sort-button" data-sort="firstName">First name</button></th>
                            <th scope="col"><button type="button" class="sort-button" data-sort="lastName">Last name</button></th>
                            <th scope="col"><button type="button" class="sort-button" data-sort="email">Email</button></th>
                            <th scope="col"><button type="button" class="sort-button" data-sort="departmentName">Department</button></th>
                            <th scope="col"><span class="visually-hidden">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody"></tbody>
                </table>
            </div>
            <nav class="pager" aria-label="Employee pages">
                <button type="button" id="previousPage" class="button-secondary">Previous</button>
                <p id="pageInfo" class="status">Page 1 of 1</p>
                <button type="button" id="nextPage" class="button-secondary">Next</button>
                <label for="pageSize">Rows per page
                    <select id="pageSize">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                    </select>
                </label>
            </nav>
        </section>

        <section class="panel" aria-labelledby="departmentHeading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">ORGANISATION</p>
                    <h2 id="departmentHeading">Departments</h2>
                </div>
            </div>

            <form id="departmentForm" class="filter-bar admin-only">
                <label for="departmentName">New department
                    <input type="text" id="departmentName" name="name"
                           maxlength="255" required placeholder="e.g. Research">
                </label>
                <button type="submit" id="addDepartment">Add department</button>
            </form>
            <p id="departmentMessage" class="status" role="status" aria-live="polite"></p>
            <ul id="departmentList" class="department-list"></ul>
        </section>
    </main>
</body>
</html>
